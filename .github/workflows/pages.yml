name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: cache
          key: tabroom-cache-${{ github.run_id }}
          restore-keys: tabroom-cache-
      - run: python app.py --selfcheck
      - run: python app.py --crawl
      - run: python app.py --freeze
      - name: Commit newly frozen seasons
        run: |
          if [ -n "$(git status --porcelain perfs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add perfs
            git commit -m "Freeze season data"
            git push
          fi
      - run: python app.py --export site
      - name: Install test tools
        run: |
          pip install pytest playwright
          playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Record the refresh (GitHub pauses schedules after 60 days without a commit)
        if: github.event_name != 'push'
        run: |
          python -c "import json; m = json.load(open('site/data/meta.json')); print(m['built_at'], m['tournaments'], 'tournaments', m['people'], 'people')" > perfs/refreshed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfs/refreshed.txt
          git commit -m "Weekly Tabroom refresh"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
